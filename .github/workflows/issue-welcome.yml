name: Issue — Welcome & Label

on:
  issues:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Apply user-replied label
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['user-replied']
            });

      - name: Post welcome comment
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.issue.user.login;
            const repoName = context.repo.repo;

            const body = [
              `Hey @${author}, your support ticket has been logged. 📱`,
              ``,
              `@TheCodingDad-TisonK has been notified and will boot up the debugging tools as soon as possible.`,
              ``,
              `**Before the dev team digs in, please confirm:**`,
              ``,
              `- [ ] You are running the latest version of Farm Tablet (visible in the mod manager)`,
              `- [ ] Your issue includes the relevant \`[FarmTablet]\` lines from \`log.txt\``,
              `  - Log location: \`Documents/My Games/FarmingSimulator2025/log.txt\``,
              `  - Search for \`[FarmTablet]\` and paste the relevant section here`,
              `- [ ] If this involves a specific app (Dashboard, Weather, Soil, Finance, etc.) — note which app and what it showed vs. what you expected`,
              `- [ ] You have searched [existing issues](https://github.com/${context.repo.owner}/${repoName}/issues) for a similar report`,
              ``,
              `> **Note:** Issues without a log snippet are difficult to diagnose and may be closed. UI and app bugs especially need log data to identify the root cause.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
